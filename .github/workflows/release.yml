name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate stable tag and package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [[ "$TAG" == "v$version" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  ci:
    needs: validate
    uses: ./.github/workflows/build.yml

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            build-tool: cargo
          - target: aarch64-unknown-linux-gnu
            build-tool: cross
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: matrix.build-tool == 'cargo'
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev pkg-config
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tlc
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          locked: true
          tar: unix
          zip: none
          checksum: sha256
          include: LICENSE,README.md
          leading-dir: true
